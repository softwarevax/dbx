name: Package Windows

# 只构建 Windows 安装包，全程在 GitHub 云端完成，本地无需任何工具/环境。
# 触发方式：
#   1. 手动：仓库 Actions 页 -> Package Windows -> Run workflow
#   2. 打标签：git tag win-x.y.z && git push origin win-x.y.z
# 注意：标签用 win- 前缀，避免误触发上游 release.yml（它监听 v* 标签）。
on:
  workflow_dispatch:
  push:
    tags:
      - "win-*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # ⚠️ 不修改 tauri.conf.json！
      # createUpdaterArtifacts=true 只影响 updater 签名文件，不影响 NSIS 安装包产出。
      # 没有签名私钥时 Tauri 会跳过签名但继续正常打包。
      # 之前用 jq/Python 改配置反而导致 Tauri 静默不产出任何文件。

      # 主构建：原样运行，不传任何签名相关参数
      # 安装包（.exe/.msi）会在签名步骤之前生成完毕；
      # 最后的 updater 签名因缺私钥会失败，但 continue-on-error 让流程继续上传。
      - name: Build Tauri app
        continue-on-error: true
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 用 bash 搜索并复制安装包（PowerShell 在 Actions 环境可能有兼容问题）
      - name: Find and copy installers
        shell: bash
        run: |
          set -x
          BASE="src-tauri/target/x86_64-pc-windows-msvc/release"
          OUTDIR="artifacts"
          mkdir -p "$OUTDIR"
          
          echo "=== GITHUB_WORKSPACE = $GITHUB_WORKSPACE ==="
          echo "=== Listing release dir ==="
          ls -la "$BASE/" 2>/dev/null || echo "release dir not found"
          echo "=== Listing bundle dir ==="
          ls -la "$BASE/bundle/" 2>/dev/null || echo "bundle dir not found"
          echo "=== Listing nsis dir ==="
          ls -la "$BASE/bundle/nsis/" 2>/dev/null || echo "nsis dir not found"
          echo "=== Listing msi dir ==="
          ls -la "$BASE/bundle/msi/" 2>/dev/null || echo "msi dir not found"
          
          FOUND=0
          
          # 搜索 NSIS .exe
          for f in "$BASE"/bundle/nsis/*.exe; do
            if [ -f "$f" ] && [ "$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null)" -gt 1048576 ]; then
              cp "$f" "$OUTDIR/"
              echo "[OK] NSIS: $(basename "$f")"
              FOUND=1
            fi
          done
          
          # 搜索 MSI
          for f in "$BASE"/bundle/msi/*.msi; do
            if [ -f "$f" ]; then
              cp "$f" "$OUTDIR/"
              echo "[OK] MSI: $(basename "$f")"
              FOUND=1
            fi
          done
          
          # 兜底：递归搜索
          if [ "$FOUND" = "0" ]; then
            echo "Standard search empty, recursive fallback..."
            find "$BASE" \( -name "*.exe" -o -name "*.msi" \) -size +1M \
              ! -path "*/deps/*" ! -path "*/.cargo/registry/*" 2>/dev/null | while read f; do
                cp "$f" "$OUTDIR/"
                echo "[OK] found: $(basename "$f")"
                FOUND=1
              done
          fi
          
          echo ""
          echo "=== Artifacts contents ==="
          ls -lh "$OUTDIR/" 2>/dev/null || echo "EMPTY"
          if [ "$FOUND" = "0" ]; then
            echo "ERROR: Nothing found!"
            echo "=== Full recursive listing of release (depth 3) ==="
            find "$BASE" -maxdepth 3 -type f 2>/dev/null | head -50
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      # 兜底：如果上面的复制+上传失败，直接从原始路径上传
      - name: Direct upload from bundle (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows-direct
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          retention-days: 30
          if-no-files-found: ignore
