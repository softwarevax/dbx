name: Package Windows

# 只构建 Windows 安装包，全程在 GitHub 云端完成，本地无需任何工具/环境。
# 触发方式：
#   1. 手动：仓库 Actions 页 -> Package Windows -> Run workflow
#   2. 打标签：git tag win-x.y.z && git push origin win-x.y.z
# 注意：标签用 win- 前缀，避免误触发上游 release.yml（它监听 v* 标签）。
on:
  workflow_dispatch:
  push:
    tags:
      - "win-*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # ⚠️ 不修改 tauri.conf.json！
      # createUpdaterArtifacts=true 只影响 updater 签名文件，不影响 NSIS 安装包产出。
      # 没有签名私钥时 Tauri 会跳过签名但继续正常打包。
      # 之前用 jq/Python 改配置反而导致 Tauri 静默不产出任何文件。

      # 主构建：原样运行，不传任何签名相关参数
      # 安装包（.exe/.msi）会在签名步骤之前生成完毕；
      # 最后的 updater 签名因缺私钥会失败，但 continue-on-error 让流程继续上传。
      - name: Build Tauri app
        continue-on-error: true
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 搜索并上传所有产物
      - name: Find and upload installers
        shell: pwsh
        run: |
          $base = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $outDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          
          Write-Host "=== Searching for build outputs ==="
          
          $found = $false
          
          # 按优先级搜索
          $patterns = @(
            @{ Path = "$base\bundle\nsis"; Filter = "*.exe"; Label = "NSIS" },
            @{ Path = "$base\bundle\msi"; Filter = "*.msi"; Label = "MSI" },
            @{ Path = "$base\bundle";     Filter = "*.exe"; Label = "Bundle EXE" },
            @{ Path = "$base";           Filter = "*.exe"; Label = "Raw EXE" },
            @{ Path = "$base";           Filter = "*.msi"; Label = "Raw MSI" }
          )
          
          foreach ($p in $patterns) {
            $files = Get-ChildItem "$($p.Path)\$($p.Filter)" -ErrorAction SilentlyContinue
            if ($files) {
              foreach ($f in $files) {
                if ($f.Length -gt 1MB) {
                  Copy-Item $f.FullName "$outDir\$($f.Name)" -Force
                  Write-Host "[OK] [$($p.Label)] $($f.Name) ($([math]::Round($f.Length/1MB, 1)) MB)"
                  $found = $true
                }
              }
            }
          }
          
          # 兜底递归搜索
          if (-not $found) {
            Write-Host "Standard search empty, recursive fallback..."
            $all = Get-ChildItem $base -Recurse -Include "*.exe","*.msi" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]deps[\\/]' -and $_.FullName -notmatch '[\\/].cargo[\\/]registry' -and $_.Length -gt 1MB }
            if ($all) {
              foreach ($f in $all) {
                Copy-Item $f.FullName "$outDir\$($f.Name)" -Force
                Write-Host "[OK] [recursive] $($f.Name) ($([math]::Round($f.Length/1MB, 1)) MB)"
                $found = $true
              }
            }
          }
          
          Write-Host ""
          if ($found) {
            Write-Host "=== Artifacts ready ==="
            Get-ChildItem $outDir | ForEach-Object { Write-Host ("  " + $_.Name + "  (" + [math]::Round($_.Length/1MB, 1) + " MB)") }
          } else {
            Write-Host "ERROR: No artifacts found at all!"
            Write-Host "--- release dir listing (depth 2) ---"
            Get-ChildItem $base -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
