name: Package Windows

# 只构建 Windows 安装包，全程在 GitHub 云端完成，本地无需任何工具/环境。
# 触发方式：
#   1. 手动：仓库 Actions 页 -> Package Windows -> Run workflow
#   2. 打标签：git tag win-x.y.z && git push origin win-x.y.z
# 注意：标签用 win- 前缀，避免误触发上游 release.yml（它监听 v* 标签）。
on:
  workflow_dispatch:
  push:
    tags:
      - "win-*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # 核心构建 + 同步复制产物（在同一步骤内完成）
      # 关键设计：
      #   1. 不修改 tauri.conf.json（改配置会导致 Tauri 静默不产出安装包）
      #   2. 用 || true 确保签名失败不阻断
      #   3. 文件复制紧跟在 build 命令之后、同一步骤内执行
      #      （避免跨步骤时文件丢失的问题）
      - name: Build and collect artifacts
        shell: bash
        run: |
          set -x

          BASE="src-tauri/target/x86_64-pc-windows-msvc/release"
          OUTDIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUTDIR"

          echo "=== Starting Tauri build ==="
          pnpm tauri build --target x86_64-pc-windows-msvc || echo "BUILD_EXIT: $?"

          echo ""
          echo "=== Searching for build outputs ==="
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"

          # 列出 release 目录结构（帮助调试）
          if [ -d "$BASE" ]; then
            echo "--- release dir exists, listing ---"
            find "$BASE" -maxdepth 4 -type f \( -name "*.exe" -o -name "*.msi" \) 2>/dev/null | head -20
          else
            echo "WARNING: release dir does not exist: $BASE"
            # 尝试其他可能的 target 路径
            echo "--- trying alternate paths ---"
            ls -la src-tauri/target/ 2>/dev/null | head -10
            ALT=$(find src-tauri/target -name "bundle" -type d 2>/dev/null | head -3)
            echo "Found bundle dirs: $ALT"
          fi

          # 按优先级复制安装包
          COPIED=0

          # 1) NSIS .exe
          for f in "$BASE"/bundle/nsis/*.exe; do
            if [ -f "$f" ]; then
              sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
              if [ "$sz" -gt 1048576 ]; then
                cp "$f" "$OUTDIR/"
                echo "[OK] NSIS: $(basename "$f") ($(( sz / 1048576 )) MB)"
                COPIED=1
              fi
            fi
          done

          # 2) MSI
          for f in "$BASE"/bundle/msi/*.msi; do
            if [ -f "$f" ]; then
              cp "$f" "$OUTDIR/"
              echo "[OK] MSI: $(basename "$f")"
              COPIED=1
            fi
          done

          # 3) 兜底：裸 .exe（非 deps）
          if [ "$COPIED" = "0" ] && [ -d "$BASE" ]; then
            echo "Standard paths empty, broad search..."
            find "$BASE" -maxdepth 3 -name "*.exe" -size +1M 2>/dev/null | while read f; do
              cp "$f" "$OUTDIR/"
              echo "[OK] raw exe: $(basename "$f")"
            done
          fi

          echo ""
          echo "=== Final artifacts ==="
          ls -lh "$OUTDIR"/ 2>/dev/null || echo "(empty)"
          echo "DONE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
