name: Package Windows

# 只构建 Windows 安装包，全程在 GitHub 云端完成，本地无需任何工具/环境。
# 触发方式：
#   1. 手动：仓库 Actions 页 -> Package Windows -> Run workflow
#   2. 打标签：git tag win-x.y.z && git push origin win-x.y.z
# 注意：标签用 win- 前缀，避免误触发上游 release.yml（它监听 v* 标签）。
on:
  workflow_dispatch:
  push:
    tags:
      - "win-*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # 用 Python 安全地修改 tauri.conf.json（不用 jq，避免 Windows 路径/编码问题）
      # 关掉 createUpdaterArtifacts 并移除 updater 插件配置，
      # 这样 fork 上没有签名私钥也能正常构建 NSIS 安装包。
      - name: Disable updater signing (Python)
        shell: pwsh
        run: |
          py -3 -c "import json, pathlib; p=pathlib.Path('src-tauri/tauri.conf.json'); c=json.loads(p.read_text()); print('Before createUpdaterArtifacts=',c['bundle'].get('createUpdaterArtifacts')); print('Before has_updater=','updater' in c.get('plugins',{})); c['bundle']['createUpdaterArtifacts']=False; c.get('plugins',{}).pop('updater',None); p.write_text(json.dumps(c,indent=2)+'\n'); c2=json.loads(p.read_text()); print('After createUpdaterArtifacts=',c2['bundle'].get('createUpdaterArtifacts')); print('After has_updater=','updater' in c2.get('plugins',{})); print('JSON valid OK')"

      # 主构建：生成 NSIS 安装包
      - name: Build Tauri app
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 递归搜索整个 target 目录下所有可执行文件，确定实际产物位置
      - name: Debug find all executables
        shell: pwsh
        run: |
          $base = "src-tauri/target/x86_64-pc-windows-msvc"
          Write-Host "=== All .exe under target (recursive) ==="
          Get-ChildItem "$base" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]deps[\\/]' -and $_.FullName -notmatch '[\\/].cargo[\\/]registry' } |
            ForEach-Object { Write-Host ("  " + $_.FullName + "  (" + [math]::Round($_.Length/1MB, 1) + " MB)") }
          Write-Host ""
          Write-Host "=== All .msi under target ==="
          Get-ChildItem "$base" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  " + $_.FullName + "  (" + [math]::Round($_.Length/1MB, 1) + " MB)") }
          Write-Host ""
          Write-Host "=== release/ dir contents ==="
          Get-ChildItem "$base/release" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  " + $_.FullName) }
          Write-Host ""
          Write-Host "=== release/bundle/ dir contents ==="
          Get-ChildItem "$base/release/bundle" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  " + $_.FullName) }

      # 用 PowerShell 收集所有找到的可执行文件到 artifacts 目录再统一上传
      - name: Collect artifacts
        shell: pwsh
        run: |
          $base = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $outDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          
          $found = $false
          
          # 优先找 NSIS 安装包
          $nsisExes = Get-ChildItem "$base\bundle\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($nsisExes) {
            foreach ($f in $nsisExes) {
              Copy-Item $f.FullName "$outDir\$($f.Name)"
              Write-Host "[OK] NSIS: $($f.Name) ($([math]::Round($f.Length/1MB, 1)) MB)"
            }
            $found = $true
          }
          
          # 找 MSI
          if (-not $found) {
            $msiFiles = Get-ChildItem $base -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
            if ($msiFiles) {
              foreach ($f in $msiFiles) {
                Copy-Item $f.FullName "$outDir\$($f.Name)"
                Write-Host "[OK] MSI: $($f.Name)"
              }
              $found = $true
            }
          }
          
          # 兜底：release 根目录裸 exe
          if (-not $found) {
            $rawExe = Get-ChildItem $base -Filter "*.exe" -Depth 0 -ErrorAction SilentlyContinue
            if ($rawExe) {
              foreach ($f in $rawExe) {
                Copy-Item $f.FullName "$outDir\$($f.Name)"
                Write-Host "[OK] raw exe: $($f.Name) ($([math]::Round($f.Length/1MB, 1)) MB)"
              }
              $found = $true
            }
          }
          
          # 最终兜底：递归搜索非依赖 exe
          if (-not $found) {
            $allExes = Get-ChildItem $base -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]deps[\\/]' -and $_.FullName -notmatch '[\\/].cargo[\\/]registry' }
            if ($allExes) {
              foreach ($f in $allExes) {
                Copy-Item $f.FullName "$outDir\$($f.Name)"
                Write-Host "[OK] found exe: $($f.Name) ($([math]::Round($f.Length/1MB, 1)) MB)"
              }
              $found = $true
            }
          }
          
          Write-Host ""
          if ($found) {
            Write-Host "=== Artifacts collected ==="
            Get-ChildItem $outDir | ForEach-Object { Write-Host ("  " + $_.Name + "  (" + [math]::Round($_.Length/1MB, 1) + " MB)") }
          } else {
            Write-Host "ERROR: No artifacts found anywhere!"
            Write-Host "=== release/ listing ==="
            Get-ChildItem $base -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
