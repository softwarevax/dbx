name: Package Windows

# 只构建 Windows 安装包，全程在 GitHub 云端完成，本地无需任何工具/环境。
# 触发方式：
#   1. 手动：仓库 Actions 页 -> Package Windows -> Run workflow
#   2. 打标签：git tag win-x.y.z && git push origin win-x.y.z
# 注意：标签用 win- 前缀，避免误触发上游 release.yml（它监听 v* 标签）。
on:
  workflow_dispatch:
  push:
    tags:
      - "win-*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # 关掉自动更新签名产物，并移除 upstream 的 updater 公钥，
      # 这样 fork 上没有 Tauri 签名私钥也能正常构建（不影响安装包使用）。
      - name: Disable updater signing
        shell: bash
        run: |
          jq '.bundle.createUpdaterArtifacts = false | del(.plugins.updater)' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp.json
          mv src-tauri/tauri.conf.tmp.json src-tauri/tauri.conf.json

      # 验证修改后的 JSON 合法性
      - name: Verify config JSON
        shell: bash
        run: |
          jq empty src-tauri/tauri.conf.json && echo "JSON is valid" || echo "JSON INVALID"
          cat src-tauri/tauri.conf.json | head -30

      # 主构建：生成 NSIS 安装包（安装时按需下载 WebView2）。
      - name: Build Tauri app
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 调试：递归搜索整个 target 目录下所有 .exe 和 .msi 文件
      - name: Debug find all executables
        shell: pwsh
        run: |
          Write-Host "=== All .exe under target ==="
          Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== All .msi under target ==="
          Get-ChildItem "src-tauri/target" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== release dir listing ==="
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
          Write-Host "=== bundle dir listing ==="
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }

      # 用 PowerShell 搜索并上传所有找到的可执行文件（不依赖固定路径）
      - name: Collect and upload build artifacts
        shell: pwsh
        run: |
          $targetDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $outDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          
          $found = $false
          
          # 1. 找 NSIS 安装包 (.exe in nsis/)
          $nsisExes = Get-ChildItem "$targetDir\bundle\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($nsisExes) {
            foreach ($f in $nsisExes) { Copy-Item $f.FullName $outDir\; Write-Host "Found NSIS: $($f.Name)" }
            $found = $true
          }
          
          # 2. 找 MSI
          $msiFiles = Get-ChildItem $targetDir -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($msiFiles) {
            foreach ($f in $msiFiles) { Copy-Item $f.FullName $outDir\; Write-Host "Found MSI: $($f.Name)" }
            $found = $true
          }
          
          # 3. 兜底：找裸 exe（不含测试和依赖）
          if (-not $found) {
            $rawExe = Get-ChildItem $targetDir -Filter "*.exe" -Depth 0 -ErrorAction SilentlyContinue
            if ($rawExe) {
              foreach ($f in $rawExe) { Copy-Item $f.FullName $outDir\; Write-Host "Found raw exe: $($f.Name)" }
              $found = $true
            }
          }
          
          # 4. 再兜底：递归找任何非 deps 的 exe
          if (-not $found) {
            $allExes = Get-ChildItem $targetDir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object {
              $_.FullName -notmatch '[\\/]deps[\\/]' -and $_.FullName -notmatch '[\\/].cargo[\\/]registry'
            }
            if ($allExes) {
              foreach ($f in $allExes) { Copy-Item $f.FullName $outDir\; Write-Host "Found exe: $($f.Name)" }
              $found = $true
            }
          }
          
          if ($found) {
            Get-ChildItem $outDir | ForEach-Object { Write-Host ("Artifact: " + $_.Name + " (" + [math]::Round($_.Length/1MB, 1) + " MB)") }
          } else {
            Write-Host "WARNING: No artifacts found anywhere!"
            Get-ChildItem $targetDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
