name: Package Windows

# 只构建 Windows 安装包，全程在 GitHub 云端完成，本地无需任何工具/环境。
# 触发方式：
#   1. 手动：仓库 Actions 页 -> Package Windows -> Run workflow
#   2. 打标签：git tag win-x.y.z && git push origin win-x.y.z
# 注意：标签用 win- 前缀，避免误触发上游 release.yml（它监听 v* 标签，会去跑
#       全平台发布流水线并因缺密钥而失败，白白烧 Runner 分钟数）。
on:
  workflow_dispatch:
  push:
    tags:
      - "win-*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # 关掉自动更新签名产物，并移除 upstream 的 updater 公钥，
      # 这样 fork 上没有 Tauri 签名私钥也能正常构建（不影响安装包使用）。
      - name: Disable updater signing
        shell: bash
        run: |
          jq '.bundle.createUpdaterArtifacts = false | del(.plugins.updater)' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp.json
          mv src-tauri/tauri.conf.tmp.json src-tauri/tauri.conf.json

      # 主构建：生成 NSIS 安装包（安装时按需下载 WebView2）。
      - name: Build Tauri app
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 额外生成「自带 WebView2 运行时」的离线安装包，适合无外网环境分发。
      - name: Build offline WebView2 installer
        continue-on-error: true
        shell: pwsh
        run: |
          pnpm tauri bundle --bundles nsis --target x86_64-pc-windows-msvc `
            --config src-tauri/tauri.webview2-offline.conf.json

      # 调试：列出实际产生的构建产物（帮助排查路径问题）
      - name: Debug: list all build outputs
        shell: pwsh
        run: |
          Write-Host "=== release/bundle contents ==="
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -ErrorAction SilentlyContinue `
            | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== release/*.exe ==="
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter "*.exe" -ErrorAction SilentlyContinue `
            | ForEach-Object { Write-Host $_.FullName }

      - name: List produced installers
        shell: pwsh
        continue-on-error: true
        run: |
          $nsisDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (Test-Path $nsisDir) {
            Get-ChildItem $nsisDir -Filter "*.exe" | ForEach-Object { Write-Host ("NSIS: " + $_.FullName) }
          } else {
            Write-Host "NSIS directory not found, listing all bundle contents..."
            Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue `
              | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows
          # 兜底：优先找 bundle 下所有内容；如果没有则上传 release 目录的 .exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
          retention-days: 30
          if-no-files-found: warn
